<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GeoFS News</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#07101f,#0b1729,#111c2e);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:450px;
  background:#111c2e;
  border:1px solid #263852;
  border-radius:18px;
  padding:35px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:31px;
  font-weight:bold;
  margin-bottom:8px;
}

.logo span{color:#60a5fa}

.subtitle{
  text-align:center;
  color:#94a3b8;
  line-height:1.5;
  margin-bottom:30px;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.description{
  text-align:center;
  color:#94a3b8;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:13px;
  background:#0b1220;
  color:white;
  border:1px solid #334155;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:70px;
}

.show-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#60a5fa;
  font-weight:bold;
  cursor:pointer;
}

.main-button{
  width:100%;
  padding:14px;
  margin-top:5px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-button:hover{background:#1d4ed8}

.main-button:disabled{
  background:#475569;
  cursor:not-allowed;
}

.switch{
  text-align:center;
  margin-top:22px;
  color:#94a3b8;
}

.switch button{
  background:none;
  border:0;
  color:#60a5fa;
  cursor:pointer;
  font-size:inherit;
  font-weight:bold;
}

#message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  line-height:1.5;
}

.error{
  display:block!important;
  background:#450a0a;
  border:1px solid #7f1d1d;
  color:#fca5a5;
}

.success{
  display:block!important;
  background:#052e16;
  border:1px solid #166534;
  color:#86efac;
}

.back-home{
  text-align:center;
  margin-top:22px;
}

.back-home a{
  color:#94a3b8;
  text-decoration:none;
}

.back-home a:hover{color:white}

.terms{
  text-align:center;
  color:#64748b;
  font-size:12px;
  line-height:1.5;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">✈ <span>GeoFS</span> News</div>

  <p class="subtitle">
    The community aviation news site for GeoFS players.
  </p>

  <h1 id="formTitle">Log In</h1>

  <p class="description" id="formDescription">
    Log in to publish and manage your articles.
  </p>

  <form id="authForm">

    <div class="form-group">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >
    </div>

    <div class="form-group">

      <label for="password">Password</label>

      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          Show
        </button>

      </div>

    </div>

    <button
      type="submit"
      class="main-button"
      id="submitButton"
    >
      Log In
    </button>

  </form>

  <div id="message"></div>

  <div class="switch">

    <span id="switchText">
      Don't have an account?
    </span>

    <button
      type="button"
      id="switchButton"
    >
      Sign Up
    </button>

  </div>

  <div class="back-home">
    <a href="index.html">← Back to GeoFS News</a>
  </div>

  <div class="terms">
    By creating an account, you agree to use GeoFS News
    responsibly and follow the community rules.
  </div>

</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "sb_publishable_i_RES7i2yApm8Dq3wZAwdw_VxzAGbdz";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("authForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const submitButton =
  document.getElementById("submitButton");

const switchButton =
  document.getElementById("switchButton");

const switchText =
  document.getElementById("switchText");

const formTitle =
  document.getElementById("formTitle");

const formDescription =
  document.getElementById("formDescription");

const message =
  document.getElementById("message");

const showPassword =
  document.getElementById("showPassword");

let signupMode = false;


/* =========================================
   CHECK EXISTING LOGIN
========================================= */

async function checkExistingLogin(){

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    return;
  }

  if(data.session){
    window.location.href = "publish.html";
  }
}

checkExistingLogin();


/* =========================================
   SHOW PASSWORD
========================================= */

showPassword.addEventListener("click",()=>{

  if(passwordInput.type === "password"){

    passwordInput.type = "text";
    showPassword.textContent = "Hide";

  }else{

    passwordInput.type = "password";
    showPassword.textContent = "Show";

  }

});


/* =========================================
   LOGIN / SIGNUP SWITCH
========================================= */

switchButton.addEventListener("click",()=>{

  signupMode = !signupMode;

  clearMessage();

  if(signupMode){

    formTitle.textContent =
      "Create Account";

    formDescription.textContent =
      "Create an account to publish GeoFS News articles.";

    submitButton.textContent =
      "Create Account";

    switchText.textContent =
      "Already have an account?";

    switchButton.textContent =
      "Log In";

    passwordInput.autocomplete =
      "new-password";

  }else{

    formTitle.textContent =
      "Log In";

    formDescription.textContent =
      "Log in to publish and manage your articles.";

    submitButton.textContent =
      "Log In";

    switchText.textContent =
      "Don't have an account?";

    switchButton.textContent =
      "Sign Up";

    passwordInput.autocomplete =
      "current-password";

  }

});


/* =========================================
   FORM
========================================= */

form.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;

  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }

  setLoading(true);

  if(signupMode){

    await createAccount(email,password);

  }else{

    await login(email,password);

  }

});


/* =========================================
   CREATE ACCOUNT
========================================= */

async function createAccount(email,password){

  const {data,error} =
    await supabaseClient.auth.signUp({

      email:email,
      password:password

    });

  if(error){

    showMessage(
      error.message,
      "error"
    );

    setLoading(false);
    return;
  }

  if(data.session){

    showMessage(
      "Account created! Redirecting...",
      "success"
    );

    setTimeout(()=>{
      window.location.href =
        "publish.html";
    },800);

  }else{

    showMessage(
      "Account created! Check your email to confirm your account, then log in.",
      "success"
    );

    setLoading(false);
  }

}


/* =========================================
   LOGIN
========================================= */

async function login(email,password){

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({

      email:email,
      password:password

    });

  if(error){

    showMessage(
      "Incorrect email or password.",
      "error"
    );

    setLoading(false);
    return;
  }

  if(data.session){

    showMessage(
      "Login successful! Redirecting...",
      "success"
    );

    setTimeout(()=>{
      window.location.href =
        "publish.html";
    },700);

  }

}


/* =========================================
   LOADING
========================================= */

function setLoading(loading){

  submitButton.disabled =
    loading;

  if(loading){

    submitButton.textContent =
      signupMode
        ? "Creating Account..."
        : "Logging In...";

  }else{

    submitButton.textContent =
      signupMode
        ? "Create Account"
        : "Log In";

  }

}


/* =========================================
   MESSAGES
========================================= */

function showMessage(text,type){

  message.textContent = text;
  message.className = type;
  message.style.display = "block";

}

function clearMessage(){

  message.textContent = "";
  message.className = "";
  message.style.display = "none";

}

</script>

</body>
</html>
