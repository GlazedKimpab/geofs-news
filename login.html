  <style>

        Arial,

</head>


<body>


  <div class="background">

    <div class="circle circle-one"></div>

    <div class="circle circle-two"></div>

  </div>


  <div class="login-container">


    <div class="login-box">


      <div class="logo">

        ✈ <span>GeoFS</span> News

      </div>


      <p class="subtitle">

        The community aviation news site
        for GeoFS players.

      </p>


      <h1 id="formTitle">
        Log In
      </h1>


      <p
        class="form-description"
        id="formDescription"
      >

        Log in to publish and manage
        your articles.

      </p>


      <form id="authForm">


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              Show
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="main-button"
          id="submitButton"
        >
          Log In
        </button>


      </form>


      <div id="message"></div>


      <div class="switch">

        <span id="switchText">
          Don't have an account?
        </span>

        <button
          type="button"
          id="switchButton"
        >
          Sign Up
        </button>

      </div>


      <div class="back-home">

        <a href="index.html">
          ← Back to GeoFS News
        </a>

      </div>


      <div class="terms">

        By creating an account, you agree
        to use GeoFS News responsibly and
        follow the site's community rules.

      </div>


    </div>

  </div>


<script>


/* ==================================================
   SUPABASE CONFIGURATION
================================================== */


/*
   IMPORTANT:

   Replace these two values with the
   values from your Supabase project.
*/


const SUPABASE_URL =
  "YOUR_SUPABASE_URL";


const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
  supabase.createClient(

    SUPABASE_URL,

    SUPABASE_ANON_KEY

  );


/* ==================================================
   ELEMENTS
================================================== */


const authForm =
  document.getElementById(
    "authForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const switchButton =
  document.getElementById(
    "switchButton"
  );


const switchText =
  document.getElementById(
    "switchText"
  );


const formTitle =
  document.getElementById(
    "formTitle"
  );


const formDescription =
  document.getElementById(
    "formDescription"
  );


const message =
  document.getElementById(
    "message"
  );


const showPassword =
  document.getElementById(
    "showPassword"
  );


/* ==================================================
   MODE
================================================== */


let signupMode = false;


/* ==================================================
   CHECK IF ALREADY LOGGED IN
================================================== */


async function checkExistingLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (error) {

    console.error(
      "Session error:",
      error
    );

    return;

  }


  if (
    data.session
  ) {

    window.location.href =
      "publish.html";

  }

}


checkExistingLogin();


/* ==================================================
   PASSWORD SHOW / HIDE
================================================== */


showPassword.addEventListener(
  "click",
  () => {

    if (
      passwordInput.type ===
      "password"
    ) {

      passwordInput.type =
        "text";

      showPassword.textContent =
        "Hide";

    } else {

      passwordInput.type =
        "password";

      showPassword.textContent =
        "Show";

    }

  }
);


/* ==================================================
   SWITCH LOGIN / SIGNUP
================================================== */


switchButton.addEventListener(
  "click",
  () => {

    signupMode =
      !signupMode;


    clearMessage();


    if (signupMode) {

      formTitle.textContent =
        "Create Account";

      formDescription.textContent =
        "Create an account to publish GeoFS News articles.";

      submitButton.textContent =
        "Create Account";

      switchText.textContent =
        "Already have an account?";

      switchButton.textContent =
        "Log In";

      passwordInput.autocomplete =
        "new-password";

    } else {

      formTitle.textContent =
        "Log In";

      formDescription.textContent =
        "Log in to publish and manage your articles.";

      submitButton.textContent =
        "Log In";

      switchText.textContent =
        "Don't have an account?";

      switchButton.textContent =
        "Sign Up";

      passwordInput.autocomplete =
        "current-password";

    }

  }
);


/* ==================================================
   FORM SUBMISSION
================================================== */


authForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;

    }


    if (!password) {

      showMessage(
        "Please enter your password.",
        "error"
      );

      return;

    }


    if (
      password.length < 6
    ) {

      showMessage(
        "Your password must be at least 6 characters long.",
        "error"
      );

      return;

    }


    setLoading(true);


    if (signupMode) {

      await createAccount(
        email,
        password
      );

    } else {

      await login(
        email,
        password
      );

    }

  }
);


/* ==================================================
   CREATE ACCOUNT
================================================== */


async function createAccount(
  email,
  password
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signUp({

        email:
          email,

        password:
          password

      });


  if (error) {

    console.error(
      error
    );

    showMessage(
      error.message,
      "error"
    );

    setLoading(false);

    return;

  }


  /*
    Depending on your Supabase
    email-confirmation settings,
    the user may need to confirm
    their email first.
  */


  if (
    data.session
  ) {

    showMessage(
      "Account created! Redirecting...",
      "success"
    );


    setTimeout(
      () => {

        window.location.href =
          "publish.html";

      },
      1000
    );


  } else {

    showMessage(
      "Account created! Check your email to confirm your account before logging in.",
      "success"
    );

    setLoading(false);

  }

}


/* ==================================================
   LOGIN
================================================== */


async function login(
  email,
  password
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


  if (error) {

    console.error(
      error
    );


    let errorMessage =
      error.message;


    if (
      error.message
        .toLowerCase()
        .includes("invalid login")
    ) {

      errorMessage =
        "Incorrect email or password.";

    }


    showMessage(
      errorMessage,
      "error"
    );


    setLoading(false);

    return;

  }


  if (
    data.session
  ) {

    showMessage(
      "Login successful! Redirecting...",
      "success"
    );


    setTimeout(
      () => {

        window.location.href =
          "publish.html";

      },
      700
    );

  }

}


/* ==================================================
   LOADING STATE
================================================== */


function setLoading(
  loading
) {

  submitButton.disabled =
    loading;


  if (loading) {

    submitButton.textContent =
      signupMode
        ? "Creating Account..."
        : "Logging In...";

  } else {

    submitButton.textContent =
      signupMode
        ? "Create Account"
        : "Log In";

  }

}


/* ==================================================
   MESSAGE
================================================== */


function showMessage(
  text,
  type
) {

  message.textContent =
    text;


  message.className =
    type;


  message.style.display =
    "block";

}


function clearMessage() {

  message.textContent =
    "";

  message.className =
    "";

  message.style.display =
    "none";

}


/* ==================================================
   AUTH STATE LISTENER
================================================== */


supabaseClient
  .auth
  .onAuthStateChange(
    (event, session) => {

      if (
        event ===
        "SIGNED_IN"
      ) {

        /*
          The login function already
          redirects, so we don't need
          to do anything here.
        */

      }

    }
  );


</script>

</body>

</html>
