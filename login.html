<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFS News - Login Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #071a2d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      color: #172033;
      width: 90%;
      max-width: 500px;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      background: #f1f5f9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      background: #168cff;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>GeoFS News Login Test</h1>

  <p>
    This page is testing the connection between your website
    and Supabase.
  </p>

  <div id="status" class="status">
    Starting test...
  </div>

  <label>Email</label>
  <input
    type="email"
    id="email"
    placeholder="your@email.com"
  >

  <label>Password</label>
  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="testButton">
    Test Supabase Login
  </button>

</div>

<script>

  /*
   ==========================================
   SUPABASE CONFIG
   ==========================================
  */

  const SUPABASE_URL =
    "https://nqguimrtkvtiunkdlvkw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_XNCrnb5rGD9rXufLQHXYiQ_kkhWVXUX";


  /*
   ==========================================
   CREATE SUPABASE CLIENT
   ==========================================
  */

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const statusBox =
    document.getElementById("status");


  /*
   ==========================================
   SHOW STATUS
   ==========================================
  */

  function status(message) {

    statusBox.textContent =
      message;

  }


  /*
   ==========================================
   INITIAL TEST
   ==========================================
  */

  async function runInitialTest() {

    status(
      "Testing Supabase connection..."
    );

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        status(
          "❌ SUPABASE ERROR\n\n" +
          "Message:\n" +
          error.message +
          "\n\n" +
          "Status:\n" +
          (error.status || "unknown")
        );

        return;
      }


      status(
        "✅ SUPABASE CONNECTION WORKS!\n\n" +
        "The website successfully connected to your Supabase project.\n\n" +
        "Current session:\n" +
        (data.session
          ? "Logged in"
          : "Not logged in")
      );


    } catch (error) {

      status(
        "❌ JAVASCRIPT ERROR\n\n" +
        error.message
      );

    }

  }


  /*
   ==========================================
   LOGIN TEST
   ==========================================
  */

  document
    .getElementById("testButton")
    .addEventListener(
      "click",
      async function () {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          status(
            "Please enter an email and password."
          );

          return;
        }


        status(
          "Attempting login..."
        );


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            status(
              "❌ LOGIN ERROR\n\n" +
              "Message:\n" +
              error.message +
              "\n\n" +
              "Status:\n" +
              (error.status || "unknown")
            );

            return;
          }


          status(
            "✅ LOGIN WORKED!\n\n" +
            "You are successfully authenticated with Supabase."
          );


        } catch (error) {

          status(
            "❌ JAVASCRIPT ERROR\n\n" +
            error.message
          );

        }

      }
    );


  /*
   ==========================================
   START
   ==========================================
  */

  runInitialTest();

</script>

</body>
</html>
