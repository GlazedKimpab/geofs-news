<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   LOGIN PROTECTION
========================================= */

async function checkLogin(){

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    window.location.href =
      "login.html";

    return;
  }

  if(!data.session){

    window.location.href =
      "login.html";

    return;
  }

  document.getElementById(
    "userEmail"
  ).textContent =
    data.session.user.email;

}

checkLogin();


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";

}


/* =========================================
   EDITOR
========================================= */

function format(command,value=null){

  document.execCommand(
    command,
    false,
    value
  );

  document.getElementById(
    "editor"
  ).focus();

}


/* =========================================
   LINK
========================================= */

function addLink(){

  const url =
    prompt(
      "Enter the website URL:"
    );

  if(!url)return;

  document.execCommand(
    "createLink",
    false,
    url
  );

}


/* =========================================
   IMAGE
========================================= */

function addImage(){

  const url =
    prompt(
      "Enter image URL:"
    );

  if(!url)return;

  document.execCommand(
    "insertImage",
    false,
    url
  );

}


/* =========================================
   QUOTE
========================================= */

function addQuote(){

  document.execCommand(
    "formatBlock",
    false,
    "blockquote"
  );

}


/* =========================================
   TABLE
========================================= */

function addTable(){

  const rows =
    parseInt(
      prompt(
        "Number of rows:",
        "3"
      )
    );

  const columns =
    parseInt(
      prompt(
        "Number of columns:",
        "3"
      )
    );

  if(
    isNaN(rows) ||
    isNaN(columns) ||
    rows < 1 ||
    columns < 1
  ){

    return;

  }


  let table = `
<table>
<tbody>
`;


  for(
    let r=0;
    r<rows;
    r++
  ){

    table += "<tr>";

    for(
      let c=0;
      c<columns;
      c++
    ){

      if(r===0){

        table +=
          "<th>Header</th>";

      }else{

        table +=
          "<td>Cell</td>";

      }

    }

    table += "</tr>";

  }


  table += `
</tbody>
</table>
<p><br></p>
`;


  document.execCommand(
    "insertHTML",
    false,
    table
  );

}


/* =========================================
   WORD COUNT
========================================= */

const editor =
  document.getElementById(
    "editor"
  );

editor.addEventListener(
  "input",
  updateWordCount
);


function updateWordCount(){

  const text =
    editor.innerText.trim();

  if(!text){

    document.getElementById(
      "wordCount"
    ).textContent = "0";

    return;

  }


  document.getElementById(
    "wordCount"
  ).textContent =
    text.split(/\s+/).length;

}


/* =========================================
   PREVIEW
========================================= */

function showPreview(){

  const title =
    document.getElementById(
      "title"
    ).value;

  const author =
    document.getElementById(
      "author"
    ).value;

  const category =
    document.getElementById(
      "category"
    ).value;

  const cover =
    document.getElementById(
      "coverImage"
    ).value;

  const content =
    document.getElementById(
      "editor"
    ).innerHTML;


  document.getElementById(
    "previewTitle"
  ).textContent =
    title;


  document.getElementById(
    "previewAuthor"
  ).textContent =
    "By " + author;


  document.getElementById(
    "previewCategory"
  ).textContent =
    category;


  document.getElementById(
    "previewContent"
  ).innerHTML =
    content;


  const image =
    document.getElementById(
      "previewImage"
    );


  if(cover){

    image.src = cover;
    image.style.display = "block";

  }else{

    image.style.display = "none";

  }


  document.getElementById(
    "preview"
  ).style.display =
    "block";

}


/* =========================================
   PUBLISH
========================================= */

async function publishArticle(){

  const title =
    document.getElementById(
      "title"
    ).value.trim();

  const author =
    document.getElementById(
      "author"
    ).value.trim();

  const category =
    document.getElementById(
      "category"
    ).value;

  const coverImage =
    document.getElementById(
      "coverImage"
    ).value.trim();

  const content =
    document.getElementById(
      "editor"
    ).innerHTML;


  if(!title){

    showStatus(
      "Please enter an article title.",
      "error"
    );

    return;

  }


  if(!author){

    showStatus(
      "Please enter an author name.",
      "error"
    );

    return;

  }


  const {
    data:sessionData
  } =
    await supabaseClient.auth.getSession();


  if(!sessionData.session){

    window.location.href =
      "login.html";

    return;

  }


  showStatus(
    "Publishing article...",
    "success"
  );


  const {data,error} =
    await supabaseClient
      .from("articles")
      .insert([{

        title:title,

        author:author,

        category:category,

        cover_image:coverImage,

        content:content,

        user_id:
          sessionData.session.user.id

      }])
      .select();


  if(error){

    console.error(error);

    showStatus(
      "Could not publish article: " +
      error.message,
      "error"
    );

    return;

  }


  showStatus(
    "Article published successfully!",
    "success"
  );


  setTimeout(()=>{

    window.location.href =
      "index.html";

  },1500);

}


/* =========================================
   STATUS
========================================= */

function showStatus(text,type){

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    text;

  status.style.display =
    "block";

  status.style.background =
    type === "success"
      ? "#14532d"
      : "#7f1d1d";

}

</script>

</body>
</html>
