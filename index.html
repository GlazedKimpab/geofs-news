<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoFS News</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Login button added to the existing navigation */

    .login-link {
      display: inline-block;
      margin-left: 10px;
      padding: 9px 16px;
      border-radius: 8px;
      background: #2563eb;
      color: white !important;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }

    .login-link:hover {
      background: #1d4ed8;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .nav-actions {
        gap: 4px;
      }

      .publish-link {
        display: none;
      }

      .login-link {
        margin-left: 0;
        padding: 8px 13px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <div class="wrap nav">

      <a class="brand" href="index.html">
        ✈️ GeoFS News
      </a>

      <div class="nav-actions">

        <a
          class="publish-link"
          href="publish.html"
        >
          Publish an article
        </a>

        <a
          class="login-link"
          href="login.html"
        >
          Login
        </a>

      </div>

    </div>

  </header>


  <!-- MAIN -->

  <main class="wrap">

    <section class="hero">

      <p class="eyebrow">
        THE COMMUNITY AVIATION NEWSROOM
      </p>

      <h1>
        What's happening in GeoFS?
      </h1>

      <p>
        News, updates, aircraft, events and stories
        written by the GeoFS community.
      </p>

      <a
        class="button"
        href="publish.html"
      >
        Write an article →
      </a>

    </section>


    <!-- LATEST ARTICLES -->

    <div class="section-head">

      <h2>
        Latest articles
      </h2>

      <input
        id="search"
        type="search"
        placeholder="Search articles…"
      >

    </div>


    <section
      id="articles"
      class="grid"
    >
      <p class="muted">
        Loading articles…
      </p>
    </section>

  </main>


  <!-- FOOTER -->

  <footer>
    <div class="wrap">
      GeoFS News — a community project.
    </div>
  </footer>


  <!-- SCRIPTS -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="app.js"></script>

</body>
</html>
